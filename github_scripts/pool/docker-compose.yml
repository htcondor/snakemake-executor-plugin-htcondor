# Three-container HTCondor pool for the CI torture test.
#
#   cm  (htcondor/cm)      collector + negotiator   — the central manager
#   ap  (htcondor/submit)  schedd + snakemake + plugin — the Access Point
#   ep  (htcondor/execute) startd + python/snakemake   — the Execution Point
#
# The ap and ep share ONLY the `staging` volume (mounted at /staging). The
# snakemake working directory lives inside the ap container and is NOT mounted
# on the ep, so every non-/staging input/output genuinely goes through HTCondor
# file transfer — which is exactly what the torture test needs to exercise.
#
# Auth: pool-password. A `pool_password` file (generated by the CI workflow or
# `make-pool-password.sh`) is mounted into all three containers; USE_POOL_PASSWORD
# turns on PASSWORD auth. CONDOR_HOST points the ap/ep at the cm.
name: htcondor-torture

services:
  cm:
    # Pinned to a specific HTCondor version (not :latest) for reproducible builds.
    image: htcondor/cm:latest
    hostname: cm
    environment:
      CONDOR_HOST: cm
      USE_POOL_PASSWORD: "yes"
    volumes:
      - ./pool_password:/root/secrets/pool_password:ro
    networks:
      - pool

  ap:
    build:
      context: ../..
      dockerfile: github_scripts/pool/Dockerfile.ap
    image: torture-ap
    hostname: ap
    environment:
      CONDOR_HOST: cm
      USE_POOL_PASSWORD: "yes"
    volumes:
      - ./pool_password:/root/secrets/pool_password:ro
      - ./pre-exec.sh:/root/config/pre-exec.sh:ro
      - staging:/staging
    networks:
      - pool
    depends_on:
      - cm

  ep:
    build:
      context: .
      dockerfile: Dockerfile.ep
    image: torture-ep
    hostname: ep
    environment:
      CONDOR_HOST: cm
      USE_POOL_PASSWORD: "yes"
      # The parallel_pipeline group sums to 4 cores / 4 GB; give headroom.
      NUM_CPUS: "4"
      MEMORY: "8192"
      RESERVED_DISK: "1024"
    volumes:
      - ./pool_password:/root/secrets/pool_password:ro
      - ./pre-exec.sh:/root/config/pre-exec.sh:ro
      - staging:/staging
    networks:
      - pool
    depends_on:
      - cm

networks:
  pool:

volumes:
  staging:
